name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android-app.zip'
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: প্রজেক্ট ফাইল প্রস্তুত (zip থাকলে খুলবে)
        run: |
          if [ -f android-app.zip ]; then unzip -o -q android-app.zip; fi
          if [ ! -d android-app ]; then echo "android-app ফোল্ডার/zip পাওয়া যায়নি"; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK বিল্ড
        env:
          APP_BUILD: ${{ github.run_number }}
        run: gradle -p android-app assembleRelease --no-daemon --stacktrace

      - name: APK-র নাম ঠিক করা
        run: cp android-app/app/build/outputs/apk/release/app-release.apk DailyDeal.apk

      - name: Release তৈরি ও APK আপলোড
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Daily Deal v1.${{ github.run_number }} (Build ${{ github.run_number }})
          body: |
            Daily Deal রিসেলার অ্যাপ — Build ${{ github.run_number }}
            স্থায়ী ডাউনলোড লিংক: https://github.com/${{ github.repository }}/releases/latest/download/DailyDeal.apk
          files: DailyDeal.apk
          make_latest: true
